name: Build, Push & Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted]  # everything runs here
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ECR_REPO: ship-a-service
      IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/ship-a-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure AWS credentials via OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Install Vault CLI


      # Fetch AWS Account ID from Vault
      - name: Get AWS Account ID from Vault
        id: get_secret
        run: |
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}
          export VAULT_ADDR=${{ secrets.VAULT_ADDR }}
          AWS_ACCOUNT_ID=$(vault kv get -field=ACCOUNT_ID secret/aws)
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV

      # Verify AWS credentials
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "✅ AWS authentication successful"

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker image
        working-directory: app/src
        run: |
          docker build -t $IMAGE_URI:main .
          docker tag $IMAGE_URI:main $IMAGE_URI:${GITHUB_SHA::8}

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push $IMAGE_URI:main
          docker push $IMAGE_URI:${GITHUB_SHA::8}

      # Configure kubectl for EKS
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ship-a-service --region $AWS_REGION

      # Setup Helm
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.3'

      # Helm deploy
      - name: Helm deploy
        working-directory: charts/app
        run: |
          helm upgrade --install ship-a-service . \
            -f values.prod.yaml \
            --set image.repository=${{ env.IMAGE_URI }} \
            --set image.tag=${GITHUB_SHA::8} \
            --namespace default \
            --create-namespace \
            --wait \
            --atomic \
            --timeout 5m

      # Additional steps: SBOM, vulnerability scan, report…
      # (Keep all your remaining steps here as-is)
